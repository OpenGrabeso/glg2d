name: Build and test (Maven)

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build with Maven
        run: |
          mkdir -p ~/.m2
          printf "<settings><servers><server><id>github</id><username>${{ secrets.ORG_USERNAME }}</username><password>${{ secrets.ORG_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml
          mvn -B package --file pom.xml -DskipTests=false -Dtest=TessellationTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Build optional JOGL adapter
        run: mvn -B -Pjogl package --file pom.xml
